syntax = "proto3";

package gamepb.emailpb;

import "corepb.proto";

message GetEmailListRequest {
    int32 box_type = 1;  // 邮件箱类型（收件箱/系统箱等，枚举由服务端约定）
}

message EmailItem {
    string id = 1;          // 邮件ID
    int32 mail_type = 2;    // 邮件类型（系统/奖励/公告等，枚举由服务端约定）
    string title = 3;       // 标题
    bool claimed = 4;       // 是否已领取附件
    bool has_reward = 5;    // 是否包含奖励
    string subtitle = 7;    // 副标题/摘要
}

message GetEmailListReply {
    repeated EmailItem emails = 1;  // 邮件列表
}

message ReadEmailRequest {
    int32 box_type = 1;   // 邮件箱类型
    string email_id = 2;  // 邮件ID
}

// 标记邮件已读（通常为空回复）
message ReadEmailReply {}

message ClaimEmailRequest {
    int32 box_type = 1;   // 邮件箱类型
    string email_id = 2;  // 邮件ID
}

message ClaimEmailReply {
    repeated corepb.Item items = 1;  // 领取到的奖励
}

message BatchClaimEmailRequest {
    int32 box_type = 1;   // 邮件箱类型
    string email_id = 2;  // 邮件ID（批量领取时的筛选/批次标识，语义以服务端为准）
}

message BatchClaimEmailReply {
    repeated corepb.Item items = 1;  // 批量领取到的奖励
}
