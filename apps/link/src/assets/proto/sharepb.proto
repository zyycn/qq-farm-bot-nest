syntax = "proto3";

package gamepb.sharepb;

import "corepb.proto";

// ============ 分享服务 ============

// --- 检查是否可以分享 ---
message CheckCanShareRequest {}

message CheckCanShareReply {
    bool can_share = 1;  // 是否可以分享
}

// --- 报告分享 ---
message ReportShareRequest {
    bool shared = 1;  // 是否已分享
}

message ReportShareReply {
    bool success = 1;  // 是否成功
}

// --- 领取分享奖励 ---
message GetInviteInfoRequest {}

message InviteRewardInfo {
    int64 stage = 1;
    int64 need_invite_count = 2;
    corepb.Item reward = 3;
}

message InviteInfoState {}

message InviteInfo {
    InviteInfoState state = 1;
    repeated InviteRewardInfo rewards = 4;
}

message GetInviteInfoReply {
    InviteInfo info = 1;
}

message ClaimShareRewardRequest {
    bool claimed = 1;  // 请求领取
}

message ClaimShareRewardReply {
    bool success = 1;           // 是否成功
    bool has_reward = 2;        // 是否有奖励
    repeated corepb.Item items = 3;  // 奖励物品列表
}
