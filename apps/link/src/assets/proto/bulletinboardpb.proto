syntax = "proto3";

package gamepb.bulletinboardpb;

message BulletinItem {
    int64 bulletin_id = 1;  // 公告ID
    string title = 2;       // 标题
    int32 status = 3;       // 状态（上架/下架/置顶等，枚举由服务端约定）
    int32 category = 5;     // 分类（活动/系统/更新等，枚举由服务端约定）
}

message GetBulletinListRequest {
    int32 offset = 1;  // 分页偏移
    int32 count = 2;   // 拉取数量
}

message GetBulletinListReply {
    repeated BulletinItem bulletins = 1;  // 公告列表
}

message GetBulletinDetailRequest {
    int64 bulletin_id = 1;  // 公告ID
}

message GetBulletinDetailReply {
    string title = 1;       // 标题
    string content = 2;     // 正文内容（可能为富文本/HTML）
    string start_time = 3;  // 开始时间（字符串格式由服务端约定）
    string end_time = 4;    // 结束时间（字符串格式由服务端约定）
}

message BulletinListChangedNTF {
    repeated BulletinItem bulletins = 1;  // 公告列表更新通知
}
