syntax = "proto3";

package gamepb.illustratedpb;

import "corepb.proto";

message GetIllustratedListV2Request {
    bool refresh = 1;
    bool full = 2;
}

message IllustratedRewardInfo {
    int32 reward_id = 1;
    int32 count = 2;
}

message IllustratedItem {
    int64 fruit_id = 1;
    int32 rarity = 2;
    bool lit = 3;
    int32 lit_reward = 4;
    int32 quality = 5;
    IllustratedRewardInfo reward_info = 6;
    bool is_new = 7;
}

message GetIllustratedListV2Reply {
    repeated IllustratedItem items = 1;
    int32 exp = 2;
    int32 level = 3;
    // Live captures show field 4 is the current chest preview item.
    corepb.Item reward_box_preview = 4;
    repeated int32 proto_ver = 5;
    int32 reward_flag = 6;
    int32 next_level_exp = 7;
    // Live captures show field 8 is a raw chest-state bit that often appears
    // before a successful claim and may disappear immediately after claim.
    bool reward_box_claimable_raw = 8;
    // Field 9 is still present in newer live captures, but behaves more like a
    // persistent chest visibility/enabled flag than an immediate claim gate.
    bool reward_box_visible = 9;
}

message ClaimAllRewardsV2Request {
    bool only_claimable = 1;
}

message ClaimAllRewardsV2Reply {
    repeated corepb.Item items = 1;
    repeated corepb.Item bonus_items = 4;
}

message ClearNewUnlockedFruitsV2Request {
    repeated int64 fruit_ids = 1;
}

message ClearNewUnlockedFruitsV2Reply {
    repeated int64 cleared_fruit_ids = 1;
}

message IllustratedRewardRedDotNotifyV2 {
    bool reward_flag = 1;
}

message IllustratedChangeNotifyV2 {
    int32 change_type = 4;
    int32 exp_before = 5;
    int32 exp_after = 6;
}
