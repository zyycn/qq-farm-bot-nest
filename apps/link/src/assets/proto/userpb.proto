syntax = "proto3";

package gamepb.userpb;

import "corepb.proto";
import "systemopenpb.proto";

// ============ 登录请求 ============
message LoginRequest {
    // 字段 1,2 保留未使用
    int64 sharer_id = 3;            // 分享者 GID（通过分享链接进入时携带）
    string sharer_open_id = 4;      // 分享者 open_id（用于跨端/跨账号标识分享者）
    DeviceInfo device_info = 5;     // 设备与客户端信息（风控/统计/兼容性）
    int64 share_cfg_id = 6;         // 分享配置 ID（区分不同分享位/活动配置）
    string scene_id = 7;            // 场景/会话标识（追踪一次进入链路）
    ReportData report_data = 8;     // 归因/投放/渠道上报数据
}

// 设备信息
message DeviceInfo {
    string client_version = 1;    // 客户端版本（例如："1.6.0.8_20251224"）
    string sys_software = 2;      // 系统软件信息（例如："Windows Unknown x64"）
    string sys_hardware = 3;      // 硬件信息（机型/设备描述）
    string telecom_oper = 4;      // 运营商信息
    string network = 5;           // 网络类型（例如："wifi"）
    int64 screen_width = 6;       // 屏幕宽度（像素）
    int64 screen_height = 7;      // 屏幕高度（像素）
    float density = 8;            // 屏幕密度
    string cpu = 9;               // CPU/平台标识（例如："microsoft"）
    int64 memory = 10;            // 内存信息（单位随客户端实现）
    string gl_render = 11;        // 图形渲染器字符串（OpenGL Renderer）
    string gl_version = 12;       // 图形版本字符串（OpenGL Version）
    string device_id = 13;        // 设备唯一标识（device_id）
    string android_oaid = 14;     // Android OAID（可选）
    string ios_caid = 15;         // iOS CAID（可选）
}

// 上报数据
message ReportData {
    string callback = 1;           // 回调信息（渠道归因回调参数）
    string cd_extend_info = 2;     // 扩展归因信息（投放侧透传）
    string click_id = 3;           // 点击 ID（广告点击标识）
    string clue_token = 4;         // 线索 token（归因/防刷）
    string minigame_channel = 5;   // 小游戏渠道标识
    int32 minigame_platid = 6;     // 小游戏平台 ID
    string req_id = 7;             // 请求 ID（链路追踪）
    string trackid = 8;            // 追踪 ID（投放追踪）
}

// ============ 登录回复 ============
message LoginReply {
    BasicInfo basic = 1;                 // 用户基础信息（等级、金币、昵称等）
    corepb.ItemBag item_bag = 2;         // 背包数据（物品列表）
    int64 time_now_millis = 3;           // 服务器当前时间（毫秒）
    bool is_first_login = 4;             // 是否首次登录
    GuideInfo guide_info = 5;
    repeated QQGroupInfo qq_group_infos = 6;  // 关联 QQ 群信息
    Illustrated illustrated = 7;
    repeated gamepb.systemopenpb.SystemUnlockItem unlocked_items = 8; // 已解锁的系统功能列表
    VersionInfo version_info = 9;        // 版本/资源版本提示
    MallMsg mall_msg = 10;
    int64 qq_friend_recommend_authorized = 11;  // QQ 好友推荐授权状态（0/1 或更细枚举）
}

// 用户基本信息
message BasicInfo {
    int64 gid = 1;            // 游戏内用户 GID
    string name = 2;          // 昵称
    int64 level = 3;          // 等级
    int64 exp = 4;            // 经验值
    int64 gold = 5;           // 金币
    string open_id = 6;       // OpenID（账号唯一标识）
    string avatar_url = 7;    // 头像 URL
    string remark = 8;        // 备注
    string signature = 9;     // 个性签名
    int32 gender = 10;        // 性别（取值由客户端/服务端约定）
    repeated AvatarFrame equip_avatar_frames = 11;
    map<int64, ShareInfo> share_infos = 12;
    int32 authorized_status = 13;  // 授权状态（与登录/分享相关）
    bool disable_nudge = 14;       // 是否关闭催熟/催促等交互
}

// QQ群信息
message QQGroupInfo {
    string qq_group_id = 1;     // QQ 群 ID
    string qq_group_name = 2;   // QQ 群名称
}

// 版本信息
message VersionInfo {
    int32 status = 1;              // 版本状态（是否需要更新等）
    string version_recommend = 2;  // 推荐版本号
    string version_force = 3;      // 强更版本号
    string res_version = 4;        // 资源版本号
}

// ============ 心跳 ============
message HeartbeatRequest {
    int64 gid = 1;              // 用户 GID
    string client_version = 2;  // 客户端版本
}

message HeartbeatReply {
    int64 server_time = 1;        // 服务端时间（秒/毫秒取决于服务端实现；抓包中常用于对时）
    VersionInfo version_info = 2; // 版本提示
}

// ============ 上报分享点击 ============
// 用于已登录状态下处理分享链接（触发好友申请）
message BatchClientReportFlowRequest {
    bytes payload = 1;  // 上报载荷（通常为埋点/归因数据，服务端内部解析）
}

message BatchClientReportFlowReply {
    int32 status = 1;   // 处理状态（0/1 或更细枚举）
}

message ReportArkClickRequest {
    int64 sharer_id = 1;         // 分享者 GID
    string sharer_open_id = 2;   // 分享者 open_id
    string share_cfg_id = 3;     // 分享配置 ID（字符串形态）
    int64 scene_id = 4;          // 场景 ID（数值形态）
}

message ReportArkClickReply {
    // 通常为空响应
}

// ============ 服务器推送通知 ============

// 基本信息变化通知 (升级/金币变化等)
message SetDisplayInfoRequest {
    string name = 1;        // 新昵称
    string avatar_url = 2;  // 新头像 URL
    bytes extra = 7;        // 扩展字段（保留；部分版本用于透传配置）
}

message SetDisplayInfoReply {
    string name = 1;        // 确认后的昵称
    string avatar_url = 2;  // 确认后的头像 URL
}

message UserSettings {}

// 获取用户设置
message GetUserSettingsRequest {}

message GetUserSettingsReply {
    UserSettings settings = 1;  // 用户设置集合
}

message SetQQFriendRecommendAuthorizedRequest {
    bool authorized = 1;   // 是否授权 QQ 好友推荐
}

message SetQQFriendRecommendAuthorizedReply {
    bool authorized = 1;   // 当前授权状态
}

message BasicNotify {
    BasicInfo basic = 1;   // 基础信息更新（等级/金币等变化）
}

// 弱引导/新手引导信息（当前仓库仅保留字段占位，后续可按抓包补全字段结构）
message GuideInfo {}

// 图鉴总览信息（当前仓库仅保留字段占位，后续可按抓包补全字段结构）
message Illustrated {}

// 商城/活动相关聚合信息（当前仓库仅保留字段占位，后续可按抓包补全字段结构）
message MallMsg {}

// 头像框/装扮信息（当前仓库仅保留字段占位，后续可按抓包补全字段结构）
message AvatarFrame {}

// 分享相关信息（当前仓库仅保留字段占位，后续可按抓包补全字段结构）
message ShareInfo {}
