syntax = "proto3";

package gamepb.careerpb;

message CareerInfoGetRequest {}

message CareerProgress {
    int64 career_id = 1;
    int64 score = 2;
}

message CareerInfoGetReply {
    repeated CareerProgress careers = 1;
    int64 total_score = 2;
    string display_name = 4;
    string avatar_url = 5;
    int64 level = 9;
    int64 extra_value = 10;
    int64 updated_at = 11;
}
